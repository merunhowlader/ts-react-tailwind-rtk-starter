name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Create test env file
        run: echo "VITE_API_BASE_URL=http://localhost:4000" > .env.test

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
